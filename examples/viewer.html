<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kcaim-geo viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  #panel { position: absolute; top: 8px; left: 8px; max-width: 320px; max-height: 70%; overflow: auto;
           background: #fffe; padding: 8px 12px; font: 13px/1.5 sans-serif; border-radius: 4px; }
  #panel h1 { font-size: 14px; margin: 0 0 4px; }
  .s-verified { color: #1a7f37 } .s-derived { color: #0969da } .s-normative { color: #8250df }
  .s-open { color: #bc4c00 } .s-volatile { color: #cf222e }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"><h1>kcaim-geo</h1><div id="list">loading…</div></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Usage: serve this directory over HTTP, open viewer.html?src=tsukisamu-park.md
const src = new URLSearchParams(location.search).get('src') || 'tsukisamu-park.md';

// Parse `# /path` sections (outside code fences); take `- status:` and the
// first json block following a `### geometry` heading.
function parse(text) {
  const sections = [];
  let cur = null, fence = null, inGeom = false, buf = null;
  for (const line of text.split('\n')) {
    const f = line.match(/^\s*(`{3,}|~{3,})(\w*)/);
    if (f) {
      if (!fence) { fence = f[1]; if (inGeom && f[2] === 'json') buf = []; }
      else if (f[1][0] === fence[0] && f[1].length >= fence.length) {
        fence = null;
        if (buf && cur) { try { cur.geometry = JSON.parse(buf.join('\n')); } catch (e) { cur.error = e.message; } buf = null; inGeom = false; }
      }
      continue;
    }
    if (fence) { if (buf) buf.push(line); continue; }
    let m;
    if ((m = line.match(/^# (\/\S*)\s*$/))) { cur = { path: m[1], status: '?' }; sections.push(cur); inGeom = false; }
    else if (cur && (m = line.match(/^- status:\s*(\w+)/))) cur.status = m[1];
    else if (cur && /^### geometry\s*$/.test(line)) inGeom = true;
  }
  return sections;
}

function bounds(geom, b) {
  (function walk(c) { typeof c[0] === 'number' ? b.extend(c) : c.forEach(walk); })(geom.coordinates);
}

const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8, sources: { osm: { type: 'raster', tileSize: 256, maxzoom: 19,
    tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], attribution: '© OpenStreetMap contributors' } },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }] },
  center: [141.35, 43.06], zoom: 11
});

Promise.all([fetch(src).then(r => r.text()), new Promise(r => map.on('load', r))]).then(([text]) => {
  const secs = parse(text);
  const features = secs.filter(s => s.geometry).map(s =>
    ({ type: 'Feature', properties: { path: s.path, status: s.status }, geometry: s.geometry }));
  map.addSource('kcaim', { type: 'geojson', data: { type: 'FeatureCollection', features } });
  map.addLayer({ id: 'area', type: 'fill', source: 'kcaim', filter: ['==', '$type', 'Polygon'], paint: { 'fill-color': '#0969da', 'fill-opacity': 0.25 } });
  map.addLayer({ id: 'line', type: 'line', source: 'kcaim', filter: ['==', '$type', 'LineString'], paint: { 'line-color': '#bc4c00', 'line-width': 3 } });
  map.addLayer({ id: 'pt', type: 'circle', source: 'kcaim', filter: ['==', '$type', 'Point'], paint: { 'circle-radius': 7, 'circle-color': '#0969da', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.on('click', e => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['area', 'line', 'pt'] })[0];
    if (f) new maplibregl.Popup().setLngLat(e.lngLat).setText(`${f.properties.path} [${f.properties.status}]`).addTo(map);
  });
  const b = new maplibregl.LngLatBounds();
  features.forEach(f => bounds(f.geometry, b));
  if (!b.isEmpty()) map.fitBounds(b, { padding: 60, maxZoom: 16 });
  document.getElementById('list').innerHTML = secs.map(s =>
    `<div><code>${s.path}</code> <b class="s-${s.status}">${s.status}</b>${s.geometry ? ' ◎' : ''}${s.error ? ' ⚠ ' + s.error : ''}</div>`).join('');
});
</script>
</body>
</html>
